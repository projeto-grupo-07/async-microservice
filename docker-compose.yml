version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-report-async:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms-report-async:latest
    container_name: ms-report-async
    depends_on:
      - rabbitmq
    ports:
      - "8081:8081"
    environment:
      # RabbitMQ connection (use service name 'rabbitmq' when running in compose)
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      # AWS credentials (do NOT commit real credentials) - prefer secrets in prod
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: "your_access_key"
      AWS_SECRET_ACCESS_KEY: "your_secret_key"

      # JVM tuning (opcional)
      JAVA_OPTS: "-Xms256m -Xmx512m"

    restart: unless-stopped

# Volumes
volumes:
  rabbitmq-data:

# Notes:
# - O serviço ms-report-async escuta na porta 8081 internamente (veja server.port em application.properties).
# - Se você já tiver outra aplicação rodando em 8080 no host, este compose não afetará ela.
# - Em produção, não exponha credenciais no arquivo: use secrets / variáveis de ambiente gerenciadas.
# - Para adicionar seu backend (produtor) ao compose, defina outro serviço e ajuste networking.

